name: gitclient
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
    sdk: ^3.14.0

dependencies:
    flutter:
        sdk: flutter
    flutter_secure_storage: ^10.3.0
    path: ^1.9.0
    flutter_archive: ^6.1.0
    webview_flutter: ^4.8.0
    flutter_markdown: ^0.7.3
    collection: ^1.18.0
    http: ^1.2.1
    dio: ^5.7.0
    path_provider: ^2.1.5
    material_ui: ^1.0.0
    cupertino_ui: ^1.0.0
    flutter_appauth: ^13.0.0
    github: ^9.25.1
    flutter_slidable: ^5.2.0

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^6.0.0

flutter:
    uses-material-design: true
    assets:
        - assets/highlight/highlight.min.js
        - assets/highlight/styles/
